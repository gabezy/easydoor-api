services:
  db:
    image: postgres:18-alpine
    container_name: easydoor-db
    volumes:
      - db:/var/lib/postgresql
    ports:
      - "5444:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=easydoor
    network_mode: bridge
volumes:
  db: